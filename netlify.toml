[build]
command = "python generate_articles.py --all"
publish = "public"

# Cache static assets aggressively
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'none'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirect trailing slashes for clean URLs
[[redirects]]
  from = "/kitchen"
  to = "/kitchen/"
  status = 301

[[redirects]]
  from = "/nursery"
  to = "/nursery/"
  status = 301

[[redirects]]
  from = "/pet-care"
  to = "/pet-care/"
  status = 301

[[redirects]]
  from = "/household"
  to = "/household/"
  status = 301

[[redirects]]
  from = "/personal-care"
  to = "/personal-care/"
  status = 301

[[redirects]]
  from = "/cleaning"
  to = "/cleaning/"
  status = 301

[[redirects]]
  from = "/tech"
  to = "/tech/"
  status = 301

[[redirects]]
  from = "/outdoor"
  to = "/outdoor/"
  status = 301

# Strip trailing slashes from article URLs to prevent redirect errors
[[redirects]]
  from = "/kitchen/*/"
  to = "/kitchen/:splat"
  status = 301

[[redirects]]
  from = "/nursery/*/"
  to = "/nursery/:splat"
  status = 301

[[redirects]]
  from = "/pet-care/*/"
  to = "/pet-care/:splat"
  status = 301

[[redirects]]
  from = "/household/*/"
  to = "/household/:splat"
  status = 301

[[redirects]]
  from = "/personal-care/*/"
  to = "/personal-care/:splat"
  status = 301

[[redirects]]
  from = "/cleaning/*/"
  to = "/cleaning/:splat"
  status = 301

[[redirects]]
  from = "/tech/*/"
  to = "/tech/:splat"
  status = 301

[[redirects]]
  from = "/outdoor/*/"
  to = "/outdoor/:splat"
  status = 301

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
